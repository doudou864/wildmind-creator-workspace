# 节奏可调；页面计数包含登录、页面打开和切换，每天所有平台合计；每页滚动段数另由适配器 maxScreens 限制。
browser:
  actionDelayMs: [1500, 3500]
  platformDelayMs: [8000, 16000]
  dwellMs: [2500, 5000]
  scrollPixels: [350, 400]
  dailyPageLimit: 200
  riskMarkers: [验证码, 拖动滑块, 安全验证, 访问频繁, 异常登录, 账号存在风险]
  confirmationPollSeconds: 30
schedule:
  timezone: Asia/Shanghai
  platforms: [douyin]
  launchdLabel: com.wildmind.creator.collect
